<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniMax-H3 · 创作工作台</title><link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}"></head><body>
<header><div class="identity"><button id="toggle-sidebar" class="tool-icon" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true" title="收起侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3z M9 4v16"/></svg></button><span class="monogram">M</span><strong>MiniMax-H3</strong><span class="subtitle">创作工作台</span></div><div class="toolbar"><span class="status"><i id="status-dot" class="dot"></i><span id="service-status">正在连接…</span></span><button id="start-model">加载模型</button></div></header>
<div class="studio" id="studio">
<button id="restore-sidebar" class="sidebar-rail" aria-label="展开侧栏" title="展开侧栏" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><aside id="sidebar" class="sidebar"><button id="restore-files" class="restore-bar" aria-label="展开文件栏" aria-controls="files-panel" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span>工作目录</span></button><section id="files-panel" class="files-panel"><div class="panel-heading"><span>工作目录</span><button class="icon-button" id="hide-files" aria-label="收起文件栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button></div><div class="workspace"><label class="sr-only" for="work-dir">工作目录</label><input id="work-dir" readonly aria-label="当前工作目录"><button id="choose-dir" class="tool-icon" type="button" aria-label="选择工作目录" title="选择工作目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h6l2 2h10v13H3z M9 13h6 M12 10v6"/></svg></button></div><div class="file-tools"><button id="upload-file" class="tool-icon" aria-label="上传文件" title="上传文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg></button><button id="reload-files" class="tool-icon" aria-label="刷新文件树" title="刷新文件树"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button></div><input id="file-upload" type="file" multiple hidden><div id="folder-label" class="folder-label">工作夹</div><div id="file-tree" role="tree" aria-label="工作目录文件树"></div></section>
<button id="restore-params" class="restore-bar" aria-label="展开参数栏" aria-controls="params-panel" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span>生成参数</span></button><section id="params-panel" class="params-panel"><div class="panel-heading"><span>生成参数</span><button class="icon-button" id="hide-params" aria-label="收起参数栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button></div><div class="parameter-body"><div class="field"><label for="mode">参考方式</label><select id="mode" name="mode" form="request-form"><option value="text">仅提示词</option><option value="frames">首帧 / 尾帧</option><option value="references">图片 / 视频参考</option></select></div><div class="field"><label for="resolution">输出画幅</label><select id="resolution"><option value="1280,720">720P · 横屏</option><option value="1920,1080">1080P · 横屏</option><option value="720,1280">720P · 竖屏</option><option value="1080,1920">1080P · 竖屏</option><option value="512,288">512 × 288</option><option value="custom">自定义</option></select><div class="two" id="size-inputs" hidden><div><label for="width">宽</label><input id="width" type="number" min="32" max="4096" step="2" value="1280"></div><div><label for="height">高</label><input id="height" type="number" min="32" max="4096" step="2" value="720"></div></div><p class="hint">高清输出使用超分处理。</p></div><div class="field"><label for="seconds">视频时长 / 秒</label><input id="seconds" name="seconds" form="request-form" type="number" min="0.1" max="60" step="0.1" value="5" required><p id="duration-hint" class="hint"></p></div><div class="field"><label for="seed">随机种子</label><input id="seed" name="seed" form="request-form" type="number" min="0" step="1" value="42" required><label class="seed-option"><input id="fixed-seed" type="checkbox">固定随机种子</label></div></div></section></aside>
<main><div id="error" class="error" role="alert" hidden></div><div class="preview-area"><div id="empty" class="empty"><div class="empty-mark">▷</div><h2>从一个想法开始</h2><p>写下场景，或添加一张参考图。<br>你的下一段视频将在这里呈现。</p></div><video id="player" controls playsinline preload="metadata" hidden></video><img id="file-preview" alt="选中的图片" hidden></div><div id="result-meta"></div>
<form id="request-form" class="composer"><div id="previews" class="previews"></div><div id="frame-inputs" hidden><input id="first-frame" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="last-frame" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><div id="reference-inputs" hidden><input id="references" type="file" multiple accept="image/png,image/jpeg,image/webp" hidden><input id="reference-videos" type="file" multiple accept="video/mp4,video/webm,video/quicktime,.mkv" hidden></div><label class="sr-only" for="prompt">提示词</label><textarea id="prompt" name="prompt" required placeholder="描述你想创作的画面、动作与镜头…"></textarea><div class="composer-footer"><div class="attachment-actions"><button type="button" id="add-image">＋ 添加图片</button><button type="button" id="add-video">＋ 视频</button><button type="button" id="add-last" hidden>＋ 尾帧</button><label id="video-audio-option" class="seed-option" hidden><input id="reference-video-audio" name="reference_video_audio" form="request-form" type="checkbox">参考视频原音轨</label></div><button class="primary" id="generate" type="submit">生成视频 ↑</button></div></form><p class="composer-note">Ctrl / ⌘ + Enter 生成 · 模型加载后驻留，可连续提交任务</p></main>
</div><div id="file-menu" class="context-menu" role="menu" aria-label="文件操作" hidden><button id="use-reference" role="menuitem" hidden>用作参考图</button><a id="file-download" role="menuitem" download>下载</a><button id="file-rename" role="menuitem">重命名</button><button id="file-delete" class="danger" role="menuitem">删除</button></div><dialog id="delete-project-dialog" class="project-dialog"><form method="dialog"><h2>删除项目？</h2><p id="delete-project-name"></p><p class="hint">项目记录和中间文件会永久删除，此操作无法撤销。</p><label class="delete-assets-option"><input id="delete-project-assets" type="checkbox">同时删除关联的输入和输出文件</label><p class="hint">未勾选时保留素材和视频。被其它项目使用的文件始终保留。</p><div class="dialog-actions"><button value="cancel">取消</button><button value="delete" class="primary">确认删除项目</button></div></form></dialog><dialog id="folder-dialog" class="project-dialog folder-dialog"><div class="folder-dialog-heading"><h2>选择工作目录</h2><button id="folder-close" class="tool-icon" aria-label="关闭文件夹选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="folder-navigation"><button id="folder-home" class="tool-icon" title="用户主目录" aria-label="用户主目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg></button><button id="folder-up" class="tool-icon" title="上一级" aria-label="上一级"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button><div id="folder-breadcrumbs"></div></div><p class="hint">选择服务器上的文件夹</p><div id="folder-error" role="alert" hidden></div><div id="folder-options"></div><div class="dialog-actions"><button id="folder-cancel">取消</button><button id="folder-select" class="primary">使用此文件夹</button></div></dialog><script src="{{ url_for('static',filename='studio.js') }}"></script></body></html>
